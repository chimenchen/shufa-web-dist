text = 精馳説，並進輻凑者，不可勝數。悉 力慕之，困於衣食，或失門戶。使蘇秦 張儀與僕並生於今之世，曾不得掌 故，安敢望侍郎乎！傳曰：‘天下無害，雖 有聖人，無所施才；上下和同，雖有賢 者，無所立功。’故曰：時異事異。
	“雖然，安可
