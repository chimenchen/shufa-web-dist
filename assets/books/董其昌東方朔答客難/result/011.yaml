text = 所欲必得，功若丘山，海內定，國家安，是 遇其時者也。子又何怪之邪？
	“語曰：以管 窺天，以蠡測海，以筳撞鐘，豈能通其 條(理)貫，考其文理，發其音聲哉？由是 觀之，譬鼱鼩之襲狗，孤豚之咋虎，至則 靡耳，何功之有？今以下愚而非處士，
