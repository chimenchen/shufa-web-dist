text = 聲。主人忘歸客不發。尋聲暗問 彈者誰。琵琶聲停欲語遲。移船 相近邀相見。添酒回燈重開宴。千呼 万喚始出來。猶抱琵琶（暗）半遮面。 轉軸撥絃三兩聲。未成曲調先有情。
