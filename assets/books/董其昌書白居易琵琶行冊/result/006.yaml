text = 教善才舞。粧成每被秋娘妬。五陵 年少爭緾頭。一曲紅綃不知數。鈿頭 銀篦擊節碎。血色羅裙翻酒污。今 年歡笑又明年。秋月春風等閑度。弟 走從軍阿姨死。暮去朝來顔色故。
